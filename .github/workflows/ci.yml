name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.9 has no setup-python build for ubuntu-24.04 (ubuntu-latest), so it
        # runs on 22.04; newer versions stay on the latest runner.
        include:
          - { python-version: "3.9", os: ubuntu-22.04 }
          - { python-version: "3.15", os: ubuntu-latest }
          - { python-version: "3.15t", os: ubuntu-latest }
    env:
      HF_HUB_OFFLINE: "1"
      STROT_TEST_CHECKPOINT: ""
      PYTHON_GIL: ${{ endsWith(matrix.python-version, 't') && '0' || '1' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install core and tests
        run: python -m pip install . pytest
      - name: Run offline tests
        run: python -m pytest -q
