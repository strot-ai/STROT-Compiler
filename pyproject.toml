[project]
name = "strot-ai"
version = "0.11.1"
description = "STROT: compile-time LLM code synthesis with deterministic, self-routing NLU runtimes (local transformer or hosted API)"
authors = [{ name = "strot-ai", email = "lee@strot-ai.xyz" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["strot", "nlu", "code-generation", "llm", "routing", "compiler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/strot-ai/Project-STROT"

[project.optional-dependencies]
# The core library is pure-stdlib. Runtime strategies pull in heavy
# dependencies only through extras, so a hosted-API production container
# never ships torch/transformers.
#
# [local] provides the PyPI substrate for the Julia decision runtime (pins
# match supersonic-julia's requirements; needs Python >=3.11). The model's
# own inference package is NOT on PyPI — bake it in at image-build time via
# strot.prefetch_nlu(install=True). Never `pip install julia` (unrelated).
local = ["transformers>=5.0,<5.1", "torch>=2.6", "safetensors>=0.5", "huggingface-hub>=0.26"]
hosted = ["openai>=1.55.3"]
anthropic = ["anthropic>=0.80"]
codex-sdk = ["openai-codex>=0.163.0"]
all = ["strot-ai[local,hosted,anthropic,codex-sdk]"]

[tool.poetry]
packages = [{ include = "strot", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-cov = "*"

[build-system]
requires = ["poetry-core>=2.2"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
