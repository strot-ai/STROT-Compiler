[tool.poetry]
name = "strot-ai"
version = "0.12.0"
description = "STROT: compile-time LLM code synthesis with deterministic, self-routing NLU runtimes (local transformer or hosted API)"
authors = ["strot-ai <lee@strot-ai.xyz>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/strot-ai/STROT-Compiler"
keywords = ["strot", "nlu", "code-generation", "llm", "routing", "compiler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
packages = [{ include = "strot", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
# The core library is pure-stdlib. Runtime strategies pull in heavy
# dependencies only through extras, so a hosted-API production container
# never ships torch/transformers.
#
# [local] provides the PyPI substrate for the Julia decision runtime (pins
# match supersonic-julia's requirements; needs Python >=3.11). The model's
# own inference package is NOT on PyPI — bake it in at image-build time via
# strot.prefetch_nlu(install=True). Never `pip install julia` (unrelated).
transformers = { version = ">=5.0,<5.1", optional = true }
torch = { version = ">=2.6", optional = true }
safetensors = { version = ">=0.5", optional = true }
huggingface-hub = { version = ">=0.26", optional = true }
openai = { version = ">=1.30", optional = true }
anthropic = { version = ">=0.80", optional = true }
gliner = { version = ">=0.2", optional = true }
sentencepiece = { version = ">=0.2", optional = true }

[tool.poetry.extras]
local = ["transformers", "torch", "safetensors", "huggingface-hub"]
finetune = ["transformers", "torch", "safetensors", "huggingface-hub"]
# [pii] = NER masking for unstructured PII (names, addresses) at the teacher
# boundary; layered on top of the zero-dep regex baseline for structured ids.
# sentencepiece is required for GLiNER's DeBERTa-v3 tokenizer (else it routes
# to tiktoken and fails to load).
pii = ["gliner", "transformers", "torch", "sentencepiece"]
hosted = ["openai"]
anthropic = ["anthropic"]
all = ["transformers", "torch", "safetensors", "huggingface-hub", "openai", "anthropic", "gliner", "sentencepiece"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-cov = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
