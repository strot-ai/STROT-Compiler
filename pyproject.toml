[tool.poetry]
name = "strot-ai"
version = "0.12.0"
description = "STROT: a decision compiler. Distill an LLM teacher into a specialized decision model that runs locally on CPU."
authors = ["strot-ai <lee@strot-ai.xyz>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/strot-ai/STROT-Compiler"
keywords = ["strot", "nlu", "decision-model", "classification", "distillation", "llm", "compiler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
packages = [{ include = "strot", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
# The core library is pure-stdlib. Compiling and serving a decision model pulls
# in torch/transformers only through the [local] extra, so the core install
# stays tiny. [local] is a standard Hugging Face encoder - nothing to bake in
# beyond the checkpoint (see strot.prefetch_nlu).
transformers = { version = ">=5.0,<5.1", optional = true }
torch = { version = ">=2.6", optional = true }
safetensors = { version = ">=0.5", optional = true }
huggingface-hub = { version = ">=0.26", optional = true }
openai = { version = ">=1.30", optional = true }
anthropic = { version = ">=0.80", optional = true }
gliner = { version = ">=0.2", optional = true }
sentencepiece = { version = ">=0.2", optional = true }

[tool.poetry.extras]
local = ["transformers", "torch", "safetensors", "huggingface-hub"]
finetune = ["transformers", "torch", "safetensors", "huggingface-hub"]
# [pii] = NER masking for unstructured PII (names, addresses) at the teacher
# boundary; layered on top of the zero-dep regex baseline for structured ids.
# sentencepiece is required for GLiNER's DeBERTa-v3 tokenizer (else it routes
# to tiktoken and fails to load).
pii = ["gliner", "transformers", "torch", "sentencepiece"]
openai = ["openai"]
anthropic = ["anthropic"]
all = ["transformers", "torch", "safetensors", "huggingface-hub", "openai", "anthropic", "gliner", "sentencepiece"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-cov = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
