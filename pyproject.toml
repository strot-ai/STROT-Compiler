[tool.poetry]
name = "strot-ai"
version = "2.0.2"
description = "STROT: a decision compiler. Your agent labels a sample; STROT distills a specialized decision model that runs locally on CPU at $0 - no LLM, no API keys."
authors = ["strot-ai <lee@strot-ai.xyz>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/strot-ai/STROT-Compiler"
keywords = ["strot", "nlu", "decision-model", "classification", "distillation", "llm", "compiler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
packages = [{ include = "strot", from = "src" }]
# Ship the agent playbook + skill files inside the wheel (strot init installs them).
include = [
    { path = "src/strot/skill/**/*.md", format = ["sdist", "wheel"] },
    { path = "src/strot/skill/scripts/*.py", format = ["sdist", "wheel"] },
]

[tool.poetry.scripts]
strot = "strot.cli:main"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
# The MCP server is the primary interface, so the SDK ships in the core install
# (python -m strot.mcp). Everything else stays light: the library is otherwise
# stdlib, and compiling/serving a decision model pulls torch/transformers only
# through the [local] extra (transformers brings safetensors + huggingface-hub
# transitively, so we do not pin them). See strot.prefetch_nlu for the encoder.
mcp = ">=2.0"
transformers = { version = ">=5.0,<5.1", optional = true }
torch = { version = ">=2.6", optional = true }

[tool.poetry.extras]
local = ["transformers", "torch"]
all = ["transformers", "torch"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-cov = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
